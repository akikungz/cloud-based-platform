name: Momoi CI Build and Push Docker Image

on:
  push:
    branches: [main, development]
    paths:
      - "apps/momoi/**"
      - "docker/momoi.dockerfile"
      - ".github/**/*.yml"
      - ".github/**/*.yaml"
      - "packages/database/**"
  pull_request:
    branches: [main, development]
    paths:
      - "apps/momoi/**"
      - "docker/momoi.dockerfile"
      - ".github/**/*.yml"
      - ".github/**/*.yaml"
      - "packages/database/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/momoi

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Bun global store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/global
          key: ${{ runner.os }}-bun-global-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-global-

      - name: Cache node_modules (workspace root)
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-modules-root-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-modules-root-

      - name: Cache node_modules (apps/momoi)
        uses: actions/cache@v4
        with:
          path: apps/momoi/node_modules
          key: ${{ runner.os }}-bun-modules-momoi-${{ hashFiles('apps/momoi/package.json') }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-modules-momoi-${{ hashFiles('apps/momoi/package.json') }}-
            ${{ runner.os }}-bun-modules-momoi-

      - name: Cache Prisma client
        uses: actions/cache@v4
        with:
          path: packages/database/node_modules/.prisma
          key: ${{ runner.os }}-prisma-${{ hashFiles('packages/database/schema.prisma') }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-prisma-${{ hashFiles('packages/database/schema.prisma') }}-
            ${{ runner.os }}-prisma-

      - name: Install dependencies (workspace root)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client (packages/database)
        working-directory: packages/database
        run: bun run prisma:generate

      - name: Run tests (apps/momoi)
        env:
          NODE_ENV: test
        working-directory: apps/momoi
        run: bun test --bail

  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/momoi.dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=momoi
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=momoi
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}
