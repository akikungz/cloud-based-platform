name: Midori CI Build and Push Docker Image

on:
  push:
    branches: [ main, development ]
    paths:
      - 'apps/midori/**'
      - 'docker/midori.dockerfile'
      - '.github/**/*.yml'
      - '.github/**/*.yaml'
  pull_request:
    branches: [ main, development ]
    paths:
      - 'apps/midori/**'
      - 'docker/midori.dockerfile'
      - '.github/**/*.yml'
      - '.github/**/*.yaml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/midori

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Bun global store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/global
          key: ${{ runner.os }}-bun-global-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-global-

      - name: Cache node_modules (workspace root)
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-modules-root-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-modules-root-

      - name: Cache node_modules (apps/midori)
        uses: actions/cache@v4
        with:
          path: apps/midori/node_modules
          key: ${{ runner.os }}-bun-modules-midori-${{ hashFiles('apps/midori/package.json') }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-modules-midori-${{ hashFiles('apps/midori/package.json') }}-
            ${{ runner.os }}-bun-modules-midori-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            apps/midori/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/midori/package.json') }}-${{ hashFiles('apps/midori/**/*.ts', 'apps/midori/**/*.tsx', 'apps/midori/**/*.js', 'apps/midori/**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('apps/midori/package.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies (workspace root)
        run: bun install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/midori.dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=midori
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=midori
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}
