services:
  db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - queue_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  jaeger:
    image: jaegertracing/jaeger:2.8.0
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "5778:5778" # HTTP
      - "14268:14268" # Jaeger Collector HTTP
      - "14250:14250" # Jaeger Collector gRPC
    volumes:
      - jaeger_data:/tmp/jaeger
      - jaeger_archive_data:/tmp/jaeger-archive
      - ./config/services/jaeger/jaeger.yml:/etc/jaeger/jaeger.yml

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  loki:
    image: grafana/loki:2.8.2
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      # - ./config/services/loki/loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki

  grafana:
    image: grafana/grafana:9.5.2
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel,grafana-clock-panel,grafana-simple-json-datasource"
    volumes:
      - grafana_data:/var/lib/grafana

  # Frontend Next.js application
  midori:
    build:
      context: .
      dockerfile: docker/midori.dockerfile
    ports:
      - "${MIDORI_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - MOMOI_API_URL=http://momoi:3001
      - NEXT_TELEMETRY_DISABLED=1
      - OTEL_SDK_DISABLED=true
      - TMPDIR=/tmp
      - HOME=/app
      - BUN_INSTALL_CACHE_DIR=/app/.bun
      - BUN_CACHE_DIR=/app/.cache
      - XDG_CACHE_HOME=/app/.cache
      - XDG_DATA_HOME=/app/.local
    depends_on:
      - db
      - momoi
    volumes:
      - ./apps/midori/public:/app/public
    restart: unless-stopped

  # Backend API service
  momoi:
    build:
      context: .
      dockerfile: docker/momoi.dockerfile
    ports:
      - "${MOMOI_PORT:-3001}:3001"
    env_file:
      - ./apps/momoi/.env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-postgres}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-user}:${RABBITMQ_PASSWORD:-password}@queue:5672
      - API_URL=http://localhost:3001
      - FRONTEND_BASE_URL=http://localhost:3000
      - TRUSTED_ORIGINS=http://midori:3000,http://momoi:3001,http://localhost:3000
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-your-secret-key-change-in-production}
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_healthy
    volumes:
      - ./packages/database:/app/packages/database:ro
    restart: unless-stopped

  # Consumer service for message processing
  yuzu:
    build:
      context: .
      dockerfile: docker/yuzu.dockerfile
    env_file:
      - ./apps/yuzu/.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-postgres}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-user}:${RABBITMQ_PASSWORD:-password}@queue:5672
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_healthy
    volumes:
      - ./packages/database:/app/packages/database:ro
    restart: unless-stopped

volumes:
  db_data:
  queue_data:
  jaeger_data:
  jaeger_archive_data:
  loki_data:
  prometheus_data:
  grafana_data:
