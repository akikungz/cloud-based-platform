apiVersion: v1
kind: Service
metadata:
  name: postgres-external
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: postgres
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: postgres
  externalIPs:
    - 10.20.30.21
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
    - name: postgres-dev
      port: 5433
      targetPort: postgres-dev
      protocol: TCP
---
