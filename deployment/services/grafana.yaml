apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: fitm-cloud
  labels:
    app.kubernetes.io/name: fitm-cloud
    app.kubernetes.io/component: grafana
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: proxmox-ceph-rbd
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: fitm-cloud
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.fitm-cloud.svc.cluster.local:9090
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          prometheusType: "prometheus"
          prometheusVersion: "v2"
          timeInterval: "15s"
          exemplarTraceIdDestination:
            - name: trace_id
              datasourceUid: "jaeger"

      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger.fitm-cloud.svc.cluster.local:16686
        isDefault: false
        editable: false
        jsonData:
          traceToLogs:
            datasourceUid: "loki"
            tags: ["job", "instance", "pod", "namespace"]
      
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.fitm-cloud.svc.cluster.local:3100
        isDefault: false
        editable: false
---
